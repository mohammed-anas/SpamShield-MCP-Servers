name: spam-shield

# One container per server. Postgres runs outside this project.
# From inside a container, host.docker.internal reaches a database published on the host.
# Each app listens on the same port inside the container as on the host.

x-db-environment: &db-environment
  SPRING_R2DBC_URL: r2dbc:postgresql://host.docker.internal:5432/spamshield
  SPRING_R2DBC_USERNAME: ${SPRING_R2DBC_USERNAME:-postgres}
  SPRING_R2DBC_PASSWORD: ${SPRING_R2DBC_PASSWORD:-postgres}

services:
  call-records-mcp-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: call-records-mcp-server
    ports:
      - "9090:9090"
    environment:
      <<: *db-environment
      SERVER_PORT: "9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9090'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 50s
    restart: unless-stopped

  call-records-rest-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: call-records-rest-server
    ports:
      - "8081:8081"
    environment:
      <<: *db-environment
      SERVER_PORT: "8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 50s
    restart: unless-stopped
